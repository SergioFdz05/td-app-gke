name: Deploy to GKE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: lab09-515718
  GKE_CLUSTER: python-appgke-cluster
  GKE_ZONE: us-central1-a
  IMAGE_NAME: us-central1-docker.pkg.dev/lab09-515718/lab09/python-appgke

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: lab09-515718
          workload_identity_provider: projects/125932713506/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@lab09-515718.iam.gserviceaccount.com

      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t "$IMAGE_NAME:$GITHUB_SHA" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

      - name: Deploy to GKE
        run: |
          gcloud container clusters get-credentials "$GKE_CLUSTER" \
            --zone="$GKE_ZONE" --project="$PROJECT_ID"
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl set image deployment/python-appgke \
            python-appgke="$IMAGE_NAME:$GITHUB_SHA"
          kubectl rollout status deployment/python-appgke --timeout=300s